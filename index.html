    <style>
        :root { 
            --bg-dark: #0f1113; 
            --bg-card: #1a1c1e; 
            --accent: #d4af37; 
            --text-main: #ffffff; 
            --text-muted: #a0a8b0; 
            --border: rgba(255, 255, 255, 0.1); 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Source Sans 3', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            line-height: 1.6; 
            overflow-x: hidden;
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        header { 
            padding: 30px 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
        }

        /* Стилі для меню навігації */
        nav { display: flex; gap: 20px; }
        nav a { 
            color: var(--text-main); 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.9rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            transition: 0.3s;
        }
        nav a:hover { color: var(--accent); }
        nav a.active { color: var(--accent); }

        .logo { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; }
        .status-badge { font-size: 0.8rem; color: var(--accent); text-transform: uppercase; font-weight: 600; opacity: 0.8; }

        .hero { 
            display: grid; 
            grid-template-columns: 1fr 1.2fr; 
            gap: 60px; 
            align-items: center; 
            padding: 60px 0; 
        }

        .hero-image-container { 
            border-radius: 20px; 
            overflow: hidden; 
            aspect-ratio: 3/4; 
            background: #222; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
        }

        .hero-image-container img { width: 100%; height: 100%; object-fit: cover; }
        .hero-content h1 { font-family: 'Montserrat', sans-serif; font-size: clamp(2.3rem, 5vw, 3.5rem); line-height: 1.1; margin-bottom: 20px; }
        .subtitle { font-size: 1.2rem; color: var(--accent); margin-bottom: 30px; }

        .info-card { background: var(--bg-card); padding: 30px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 30px; }
        .info-card p { margin-bottom: 10px; color: var(--text-muted); }
        .info-card strong { color: var(--text-main); }

        .section-title { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; margin: 60px 0 40px; text-align: center; color: var(--accent); }

        .services-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            margin-bottom: 80px;
            align-items: start;
        }

        .services-grid-inner {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .service-card { 
            background: var(--bg-card); 
            padding: 25px; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
        }

        .service-card h3 { color: var(--accent); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-family: 'Montserrat', sans-serif; }
        .service-card ul { list-style: none; }
        .service-card ul li { position: relative; padding-left: 20px; margin-bottom: 8px; font-size: 0.95rem; color: var(--text-muted); }
        .service-card ul li::before { content: "•"; position: absolute; left: 0; color: var(--accent); }

        .side-image-container {
            border-radius: 20px;
            overflow: hidden;
            height: 100%;
            min-height: 500px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .side-image-container img { width: 100%; height: 100%; object-fit: cover; }
